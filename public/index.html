<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wordo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app">
      <!-- Start screen -->
      <section id="join" class="screen">
        <h1 class="logo">Word<span class="o-dot">o</span></h1>
        <p class="tagline">Guess the secret word. Fewer guesses is better.</p>
        <form id="join-form" class="card">
          <div class="lang-field">
            <span class="lang-label">Choose a language <span class="hint">(the words you'll guess)</span></span>
            <div id="lang-options" class="lang-options"></div>
          </div>
          <div class="lang-field">
            <span class="lang-label">Difficulty</span>
            <div id="diff-options" class="lang-options">
              <button type="button" class="diff-btn active" data-diff="easy">Easy</button>
              <button type="button" class="diff-btn" data-diff="medium">Medium</button>
              <button type="button" class="diff-btn" data-diff="hard">Hard</button>
            </div>
          </div>
          <div class="row">
            <button type="submit" id="join-btn" class="primary" disabled>Play</button>
          </div>
          <p id="join-error" class="error"></p>
        </form>
      </section>

      <!-- Game screen -->
      <section id="game" class="screen hidden">
        <header class="game-header">
          <span class="logo small">Word<span class="o-dot">o</span></span>
          <span class="round-badge">Round <strong id="round-num">1</strong></span>
          <span class="count-badge">Guesses <strong id="guess-count">0</strong></span>
          <button id="sound-btn" class="ghost icon-btn" title="Sound on/off">🔊</button>
          <button id="leave-btn" class="ghost">Change language</button>
        </header>

        <div id="win-banner" class="banner hidden"></div>
        <div id="toast" class="toast hidden" aria-live="polite"></div>

        <div class="game-grid">
          <main>
            <form id="guess-form">
              <input id="guess" placeholder="Type a word and press Enter" autocomplete="off" autofocus />
              <button type="submit" class="primary">Guess</button>
            </form>
            <p id="guess-msg" class="guess-msg"></p>

            <div id="closest" class="closest hidden">
              <div class="closest-top">
                <span class="closest-label">Closest</span>
                <span id="closest-word" class="closest-word"></span>
                <span id="closest-rank" class="closest-rank"></span>
              </div>
              <div class="closest-meter"><div id="closest-fill" class="closest-fill"></div></div>
            </div>

            <div class="action-row">
              <button id="hint-btn" class="ghost hint-btn hidden">💡 Get a hint</button>
              <button id="giveup-btn" class="ghost giveup-btn hidden">Give up</button>
            </div>
            <button id="new-round" class="ghost full hidden">New game</button>
            <ul id="guesses" class="guesses"></ul>
          </main>

          <aside id="history">
            <h2 id="history-title">Your guesses</h2>
            <ul id="history-list" class="history-list"></ul>
          </aside>

          <aside id="stats">
            <h2>Your stats</h2>
            <div id="stats-summary" class="stats-summary"></div>
            <div class="stats-chart-title">Recent games</div>
            <div id="stats-chart" class="stats-chart"></div>
            <div class="stats-chart-title">Achievements</div>
            <div id="achievements" class="achievements"></div>
          </aside>
        </div>
      </section>
    </div>

    <div id="modal" class="modal-overlay hidden">
      <div class="modal">
        <p id="modal-text"></p>
        <div class="modal-actions">
          <button type="button" id="modal-cancel" class="ghost">Cancel</button>
          <button type="button" id="modal-ok" class="primary">OK</button>
        </div>
      </div>
    </div>
    <script src="app.js" type="module"></script>
  </body>
</html>
